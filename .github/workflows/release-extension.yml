# Releases the catm Chrome extension.
#
# Trigger
#   • Push to main. A release only proceeds when package.json's version
#     (the single source of truth) changed vs the parent commit, AND the
#     full Test suite passes. Pushes that change the bundle without bumping
#     ride along with the next bump.
#
# Pipeline
#   detect     — compare package.json version to HEAD~1; emit version/changed.
#   check-tag  — skip the release if the ext-v<version> tag already exists.
#   test       — `uses: ./.github/workflows/test.yml` — the release gate.
#                Release only proceeds if the unit + e2e suite passes.
#   release    — build dist/, zip it, create the GitHub Release,
#                and (if CWS_* secrets are set) auto-publish to the Chrome
#                Web Store via chrome-webstore-upload-cli.
#
# Secrets to add (Repo settings → Secrets and variables → Actions)
#   CWS_APP_ID         — extension ID from the Chrome Web Store dashboard
#   CWS_CLIENT_ID      — OAuth 2.0 client ID from Google Cloud Console
#   CWS_CLIENT_SECRET  — OAuth 2.0 client secret
#   CWS_REFRESH_TOKEN  — one-time OAuth refresh token; the setup flow is
#                        documented at
#                        https://github.com/fregante/chrome-webstore-upload-keys

name: Release extension

on:
  push:
    branches: [main]

permissions:
  contents: write  # to create GitHub releases

concurrency:
  group: release-extension
  cancel-in-progress: false  # never cancel an in-flight publish

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ver.outputs.changed }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: ver
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git cat-file -e HEAD~1:package.json 2>/dev/null; then
            previous=$(git show HEAD~1:package.json | jq -r .version)
          else
            previous=""
          fi
          if [ "$version" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped: ${previous:-<none>} → $version"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($version) — skipping release"
          fi

  check-tag:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether release tag already exists
        id: tag
        run: |
          tag="ext-v${{ needs.detect.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists — skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag is free"
          fi

  # The gate: release only proceeds if the full test suite passes.
  test:
    needs: [detect, check-tag]
    if: needs.detect.outputs.changed == 'true' && needs.check-tag.outputs.exists == 'false'
    uses: ./.github/workflows/test.yml

  release:
    needs: [detect, check-tag, test]
    if: needs.detect.outputs.changed == 'true' && needs.check-tag.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build extension bundle
        # dist/ is gitignored; crxjs + Vite generate it (manifest, bundled SW,
        # side-panel HTML/JS, icons) and it has to exist before the zip step.
        run: npm run build

      - name: Build release zip
        run: ./scripts/package-extension.sh

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catm-v${{ needs.detect.outputs.version }}
          path: catm-v${{ needs.detect.outputs.version }}.zip
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ext-v${{ needs.detect.outputs.version }}"
          zip="catm-v${{ needs.detect.outputs.version }}.zip"
          gh release create "$tag" "$zip" \
            --title "Extension v${{ needs.detect.outputs.version }}" \
            --target "${{ github.sha }}" \
            --notes "Auto-built from ${{ github.sha }}. If CWS auto-publish is not configured, upload $zip to the Chrome Web Store dashboard manually."

      - name: Publish to Chrome Web Store
        env:
          CWS_APP_ID: ${{ secrets.CWS_APP_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "${CWS_APP_ID:-}" ] || [ -z "${CWS_CLIENT_ID:-}" ] \
             || [ -z "${CWS_CLIENT_SECRET:-}" ] || [ -z "${CWS_REFRESH_TOKEN:-}" ]; then
            echo "::notice::CWS_* secrets not set — skipping auto-publish. The zip is attached to the GitHub Release; upload it via the Chrome Web Store dashboard."
            exit 0
          fi
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source catm-v${{ needs.detect.outputs.version }}.zip \
            --extension-id "$CWS_APP_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN"
          npx --yes chrome-webstore-upload-cli@3 publish \
            --extension-id "$CWS_APP_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN"
